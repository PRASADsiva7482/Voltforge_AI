name: Deploy VoltForge AI Microservice to Azure

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or Version to Deploy (e.g. v1.0.0)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate Image Metadata & Tag
        id: meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LOWER}/voltforge-ai"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "Image target: ${IMAGE}:${TAG}"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          script: |
            set -e
            echo "[*] Pulling updated image: ${{ env.IMAGE }}:${{ env.TAG }}..."
            docker pull "${{ env.IMAGE }}:${{ env.TAG }}"
            docker tag "${{ env.IMAGE }}:${{ env.TAG }}" "${{ env.IMAGE }}:latest"

            echo "[*] Updating voltforge-ai container on Azure VM..."
            cd /opt/voltforge/azureDeploy
            export AI_IMAGE="${{ env.IMAGE }}:${{ env.TAG }}"
            docker compose up -d --no-deps voltforge-ai

            echo "[+] VoltForge AI Microservice (${{ env.TAG }}) successfully deployed to Azure!"
